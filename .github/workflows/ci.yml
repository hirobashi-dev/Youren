name: Engineering foundations

# 只验证代码，不部署、不发布、不触发EAS；iOS设备验收按用户决定延期。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - name: 固定npm并安装
        run: |
          npm install --global npm@10.5.0
          npm ci --no-audit --no-fund
      - name: 前端、历史规范和合同检查
        run: npm run check:frontend

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
          cache: maven
      - name: 固定npm并安装报告工具
        run: |
          npm install --global npm@10.5.0
          npm ci --no-audit --no-fund
      # hosted runner提供Docker；缺失时preflight和Testcontainers必须失败。
      - name: Maven Wrapper及真实集成检查
        run: npm run check:backend
      - name: 保存JUnit报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-test-reports
          path: backend/**/target/*-reports/TEST-*.xml
          retention-days: 7
      - name: 将已验收API交给浏览器联调
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-java-api
          path: backend/api/target/youren-api-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
      - name: 固定npm并安装浏览器
        run: |
          npm install --global npm@10.5.0
          npm ci --no-audit --no-fund
          npm exec -w @youren/admin -- playwright install --with-deps chrome
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-java-api
          path: backend/api/target
      - name: 创建隔离本机测试配置
        run: cp infra/.env.example infra/.env
      - name: 模拟浏览器与真实Java故障恢复
        run: npm run check:browser
      - name: 保存浏览器失败证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            apps/admin/test-results/
            docs/development/artifacts/admin-java.png
          retention-days: 7
